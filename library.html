<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Cave · Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="nursery-body">
    <a href="home.html" class="corner-logo" aria-label="Home">
        <span class="corner-logo__circle">
            <img src="Claire Chen Me Ink.png" alt="Claire Chen Me Ink">
        </span>
        <span class="corner-logo__dot"></span>
    </a>

    <!-- User coin balance, fixed up top (website-wide, persisted) -->
    <div class="coins-bar">
        <span class="coins-coin" aria-hidden="true"></span>
        <span class="coins-label">coins:</span>
        <span id="coin-balance" class="coins-amount">0</span>
    </div>

    <header class="site-header nursery-header">
        <h1 class="title">LIBRARY</h1>
        <p class="nursery-welcome">books, guides &amp; notes from the cave.</p>

        <div class="library-hero-wrap">
            <img class="library-hero" src="bookshelves.png" alt="Bookshelves">
            <img class="library-hero-corner" src="door.png" alt="" aria-hidden="true">
        </div>

        <!-- Books stand on a brown wooden shelf. Just the cover art; a locked
             book is hidden behind a grey panel with a ? and a how-to-unlock hint. -->
        <div class="library-shelf" id="library-shelf">
            <a href="book-of-knowledge.html" class="lib-book" id="lib-book-knowledge" aria-label="Book of Knowledge">
                <img src="book1.png" alt="Book of Knowledge">
                <span class="lib-book__lock" id="lib-book-knowledge-lock" aria-hidden="true">
                    <span class="lib-book__q">?</span>
                    <span class="lib-book__hint">give 10 coins to unlock</span>
                </span>
            </a>

            <a href="persica.html" class="lib-book" aria-label="Persica">
                <img src="persica.png" alt="Persica">
            </a>
        </div>
    </header>

    <script src="storage.js"></script>
    <script src="seeds.js"></script>
    <script src="achievements.js"></script>
    <script src="trail.js"></script>

    <!-- Rabbit door popup: shown when you've grown 100 carrots. Give 100
         carrots from your harvested inventory to enter the rabbit hub. -->
    <div class="rabbit-door-modal" id="rabbit-door-modal" hidden>
        <div class="rabbit-door-card">
            <h3>PLEASE GIVE 100 CARROTS</h3>
            <p class="rabbit-door-note" id="rabbit-door-note">you have 0 carrots.</p>
            <div class="rabbit-door-actions">
                <button type="button" id="rabbit-back">back</button>
                <button type="button" id="rabbit-give" disabled>give</button>
            </div>
        </div>
    </div>

    <script>
        renderCoinBalance();
        // If the Book of Knowledge is already unlocked, lift the grey ? cover
        // so the real book cover shows through on the shelf.
        if (isBookUnlocked()) {
            const lock = document.getElementById('lib-book-knowledge-lock');
            if (lock) lock.hidden = true;
        }

        // ===== Rabbit door (tiny door on the bookshelf corner) =====
        // Tap it: if you've never grown 100 carrots, "knock knock" floats up
        // and you can't enter. If you HAVE grown 100, a popup asks you to
        // give 100 carrots from your harvested inventory to enter the hub.
        const RABBIT_COST = 100;
        const HARV_KEY    = 'bearcave_harvested';   // current harvested crops
        const harvestedNow = () => loadJSON(HARV_KEY, {});
        const carrotCount  = () => harvestedNow().carrot || 0;

        const door      = document.querySelector('.library-hero-corner');
        const heroWrap  = document.querySelector('.library-hero-wrap');
        const modal     = document.getElementById('rabbit-door-modal');
        const note      = document.getElementById('rabbit-door-note');
        const giveBtn   = document.getElementById('rabbit-give');
        const backBtn   = document.getElementById('rabbit-back');

        function showKnockKnock() {
            if (!heroWrap) return;
            const k = document.createElement('span');
            k.className = 'knock-knock';
            k.textContent = 'knock knock';
            heroWrap.appendChild(k);
            // remove the node once the float-out animation finishes
            setTimeout(() => { if (k.parentNode) k.remove(); }, 1900);
        }

        function openRabbitModal() {
            const have = carrotCount();
            note.textContent = 'you have ' + have + ' carrot' + (have === 1 ? '' : 's') + '.';
            giveBtn.disabled = have < RABBIT_COST;
            modal.hidden = false;
        }
        function closeRabbitModal() { modal.hidden = true; }

        door.addEventListener('click', () => {
            if (isRabbitDoorPaid()) {
                // already gave 100 carrots once — door opens for free now
                window.location.href = 'rabbit-hub.html';
            } else if (harvestedCount('carrot') >= RABBIT_COST) {
                openRabbitModal();      // grown 100 carrots - offer to enter
            } else {
                showKnockKnock();       // not yet - knock knock
            }
        });

        backBtn.addEventListener('click', closeRabbitModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeRabbitModal(); });

        giveBtn.addEventListener('click', () => {
            if (giveBtn.disabled) return;
            const h = harvestedNow();
            h.carrot = (h.carrot || 0) - RABBIT_COST;
            if (h.carrot <= 0) delete h.carrot;
            saveJSON(HARV_KEY, h);      // give the carrots away
            payRabbitDoor();            // remember: never ask for carrots again
            window.location.href = 'rabbit-hub.html';
        });
    </script>
</body>
</html>
