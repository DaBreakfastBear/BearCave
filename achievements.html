<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Cave · Achievements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="nursery-body">
    <a href="home.html" class="corner-logo" aria-label="Home">
        <span class="corner-logo__circle">
            <img src="Claire Chen Me Ink.png" alt="Claire Chen Me Ink">
        </span>
        <span class="corner-logo__dot"></span>
    </a>

    <!-- User coin balance, fixed up top (website-wide, persisted) -->
    <div class="coins-bar">
        <span class="coins-coin" aria-hidden="true"></span>
        <span class="coins-label">coins:</span>
        <span id="coin-balance" class="coins-amount">0</span>
    </div>

    <header class="site-header nursery-header">
        <h1 class="title">ACHIEVEMENTS</h1>
        <p class="nursery-welcome">milestones from your bear cave journey.</p>
        <p class="ach-summary" id="ach-summary"></p>

        <!-- One long list of every achievement, grouped by category -->
        <div class="ach-grid" id="ach-grid"></div>
    </header>

    <script src="storage.js"></script>
    <script src="seeds.js"></script>
    <script>
        renderCoinBalance();

        // =====================================================================
        //  EDIT YOUR ACHIEVEMENT WORDING HERE  ✏️
        //  Just change the text inside the quotes (title + desc).
        //  The numbers in `goal` and the `current` functions make them work.
        // =====================================================================

        // ---- 🌱 PLANTING (per crop, 4 tiers each) ----
        const WORDING = {
            potato: {
                1:   { title: 'first potato',                      desc: 'plant your first potato.' },
                5:   { title: 'potatopotatopotatopotatopotato',     desc: 'plant 5 potatoes.' },
                20:  { title: 'potato x20',                         desc: 'plant 20 potatoes.' },
                100: { title: 'potato x100',                        desc: 'plant 100 potatoes.' }
            },
            carrot: {
                1:   { title: 'first carrot',   desc: 'plant your first carrot.' },
                5:   { title: 'carrot ^ 5',      desc: 'plant 5 carrots.' },
                20:  { title: 'carrot x20',     desc: 'plant 20 carrots.' },
                100: { title: 'carrot x100',    desc: 'plant 100 carrots.' }
            },
            radish: {
                1:   { title: 'first radish',  desc: 'plant your first radish.' },
                5:   { title: 'radish x5',     desc: 'plant 5 radishes.' },
                20:  { title: 'radish x20',    desc: 'plant 20 radishes.' },
                100: { title: 'radish x100',   desc: 'plant 100 radishes.' }
            },
            cabbage: {
                1:   { title: 'first cabbage', desc: 'plant your first cabbage.' },
                5:   { title: 'cabbage x5',    desc: 'plant 5 cabbages.' },
                20:  { title: 'cabbage x20',   desc: 'plant 20 cabbages.' },
                100: { title: 'cabbage x100',  desc: 'plant 100 cabbages.' }
            },
            cauliflower: {
                1:   { title: 'first cauliflower', desc: 'plant your first cauliflower.' },
                5:   { title: 'cauliflower x5',   desc: 'plant 5 cauliflowers.' },
                20:  { title: 'cauliflower x20',  desc: 'plant 20 cauliflowers.' },
                100: { title: 'cauliflower x100', desc: 'plant 100 cauliflowers.' }
            }
        };
        const PLANT_TIERS = [1, 5, 20, 100];

        // Helper to build an "item" object: { icon, title, desc, current, goal }
        function item(icon, title, desc, current, goal) {
            return { icon, title, desc, current: Math.min(current, goal), goal, done: current >= goal };
        }

        // ---- 💧 WATERING ----
        const WATERING_ACH = [
            item('💧', 'first drop',   'water a plant for the first time.',  getWateredCount(),     1),
            item('💧', 'rainmaker',     'water plants 10 times.',            getWateredCount(),    10),
            item('💧', 'downpour',     'water plants 50 times.',            getWateredCount(),    50),
            item('💧', 'wellspring',   'water plants 100 times.',           getWateredCount(),   100),
            item('💧', 'hydrated',      'own 10 gallons of water at once.', getWater(),           10),
            item('💧', 'reservoir',    'own 100 gallons of water at once.', getWater(),         100)
        ];

        // ---- 🪴 FERTILIZER ----
        const FERT_ACH = [
            item('🪴', 'first feed',  'use fertilizer on a plant.',        getFertUsed(),      1),
            item('🪴', 'green thumb', 'use fertilizer 10 times.',          getFertUsed(),     10),
            item('🪴', 'super soil',  'use fertilizer 50 times.',          getFertUsed(),     50),
            item('🪴', 'stockpile',   'own 10 fertilizer at once.',        getFertilizer(),  10)
        ];

        // ---- 🌾 MARKET (selling crops) ----
        const MARKET_ACH = [
            item('🌾', 'first sale', 'sell your first crop.',              getSoldCount(),   1),
            item('🌾', 'merchant',   'sell 50 crops in total.',            getSoldCount(),  50),
            item('🌾', 'trader',     'sell 100 crops in total.',          getSoldCount(), 100),
            item('🌾', 'tycoon',     'sell 500 crops in total.',          getSoldCount(), 500)
        ];

        // ---- 🐜 PESTS ----
        const PESTS_ACH = [
            item('🐜', 'first clear',    'shoo ants off a plant.',          getAntsCleared(),  1),
            item('🐜', 'ant slayer',     'clear ants 10 times.',            getAntsCleared(), 10),
            item('🐜', 'exterminator',  'clear ants 50 times.',            getAntsCleared(), 50),
            item('🐜', 'prepared',        'buy pest control.',              getPestControl(),  1)
        ];

        // ---- 🪙 WEALTH (coins) ----
        const WEALTH_ACH = [
            item('🪙', 'pocket money', 'hold 100 coins at once.',   getCoins(),  100),
            item('🪙', 'saver',         'hold 500 coins at once.',   getCoins(),  500),
            item('🪙', 'rich bear',     'hold 1000 coins at once.',  getCoins(), 1000),
            item('🪙', 'tycoon bear',   'hold 5000 coins at once.', getCoins(), 5000)
        ];

        // ---- ✨ RESET (survives resets) ----
        const RESET_ACH = [
            item('✨', 'fresh start',  'reset the game once.',   getResets(),  1),
            item('✨', 'clean slate',  'reset the game 3 times.', getResets(), 3),
            item('✨', 'do-over',       'reset the game 5 times.', getResets(), 5),
            item('✨', 'groundhog',     'reset the game 10 times.', getResets(), 10)
        ];

        // =====================================================================
        //  Long-list render — every achievement in one scrolling list,
        //  grouped by category (no separate tabs).
        // =====================================================================
        const grid    = document.getElementById('ach-grid');
        const summary = document.getElementById('ach-summary');

        // Build the planting items from WORDING.
        function plantingItems() {
            const out = [];
            SEED_KEYS.forEach(key => {
                const count = plantedCount(key);
                PLANT_TIERS.forEach(n => {
                    const w = WORDING[key][n];
                    out.push({
                        icon:    '<img src="' + SEEDS[key].img + '" alt="' + SEEDS[key].name + '">',
                        title:   w.title,
                        desc:    w.desc,
                        current: Math.min(count, n),
                        goal:    n,
                        done:    count >= n
                    });
                });
            });
            return out;
        }

        // Each group: { label, items }
        const GROUPS = [
            { label: '🌱 planting',   items: plantingItems()  },
            { label: '💧 watering',   items: WATERING_ACH     },
            { label: '🪴 fertilizer',  items: FERT_ACH         },
            { label: '🌾 market',      items: MARKET_ACH       },
            { label: '🐜 pests',       items: PESTS_ACH        },
            { label: '🪙 wealth',      items: WEALTH_ACH       },
            { label: '✨ reset',       items: RESET_ACH        }
        ];

        function makeCard(a) {
            const card = document.createElement('article');
            card.className = 'ach-card ' + (a.done ? 'ach-card--unlocked' : 'ach-card--locked');
            card.innerHTML =
                '<div class="ach-icon">' + a.icon + '</div>' +
                '<div class="ach-body">' +
                    '<h3>' + a.title + '</h3>' +
                    '<p>' + a.desc + '</p>' +
                    '<p class="ach-progress">' + a.current + ' / ' + a.goal + '</p>' +
                '</div>' +
                '<span class="ach-status">' + (a.done ? '✓' : '🔒') + '</span>';
            return card;
        }

        function render() {
            grid.innerHTML = '';
            let unlocked = 0;
            let total    = 0;
            GROUPS.forEach(group => {
                // group header — full width across the grid
                const head = document.createElement('h2');
                head.className = 'ach-group';
                head.textContent = group.label;
                grid.appendChild(head);
                group.items.forEach(a => {
                    if (a.done) unlocked++;
                    total++;
                    grid.appendChild(makeCard(a));
                });
            });
            summary.textContent = unlocked + ' / ' + total + ' unlocked';
        }

        render();
    </script>
</body>
</html>
