<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Cave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="home.html" class="corner-logo" aria-label="Home">
        <span class="corner-logo__circle">
            <img src="Claire Chen Me Ink.png" alt="Claire Chen Me Ink">
        </span>
        <span class="corner-logo__dot"></span>
    </a>

    <!-- User coin balance, fixed up top (website-wide, persisted) -->
    <div class="coins-bar">
        <span class="coins-coin" aria-hidden="true"></span>
        <span class="coins-label">coins:</span>
        <span id="coin-balance" class="coins-amount">0</span>
    </div>

    <header class="site-header">
        <h1 class="title">BEAR CAVE</h1>
        <p class="nursery-welcome">welcome to your bear cave!</p>
        <!-- Shown only while broke & the free start coin is unclaimed -->
        <p id="broke-hint" class="broke-hint" hidden>0 coins? try looking in the nursery!</p>

        <!-- Grid of navigation cards -->
        <nav class="home-grid">
            <a href="plant.html" class="home-card" aria-label="Visit the nursery">
                <img src="Screenshot 2026-08-23 at 9.07.49 PM.png" alt="The Nursery">
                <span class="home-card__label">the nursery</span>
            </a>
            <a href="library.html" class="home-card home-card--transparent" aria-label="Visit the library">
                <img src="bookshelves.png" alt="Library">
                <span class="home-card__label">library</span>
            </a>
            <a href="achievements.html" class="home-card home-card--transparent" aria-label="View achievements">
                <img src="award.png" alt="Achievements">
                <span class="home-card__label">achievements</span>
            </a>
            <a href="fountain.html" class="home-card home-card--transparent" aria-label="Visit the fountain">
                <img src="rainbow.svg" alt="The Fountain">
                <span class="home-card__label">the fountain</span>
            </a>
        </nav>
    </header>

    <!-- Dev/test safe: enter a code to dump carrots & coins for testing -->
    <button type="button" id="test-safe" aria-label="Dev safe">🔐</button>

    <div class="rabbit-door-modal" id="test-safe-modal" hidden>
        <div class="rabbit-door-card">
            <h3>SAFE</h3>
            <p class="rabbit-door-note">enter the code</p>
            <input id="test-safe-code" type="password" inputmode="numeric" autocomplete="off"
                   placeholder="code"
                   style="width:100%;box-sizing:border-box;padding:0.5rem 0.75rem;border:2px solid #d8c5a8;border-radius:10px;font:inherit;margin:0.4rem 0 0.6rem;" />
            <p class="rabbit-door-note" id="test-safe-msg" hidden></p>
            <div class="rabbit-door-actions">
                <button type="button" id="test-safe-back">back</button>
                <button type="button" id="test-safe-ok">open</button>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="seeds.js"></script>
    <script src="achievements.js"></script>
    <script src="trail.js"></script>
    <script>
        renderCoinBalance();
        renderBrokeHint();

        // --- Hidden free starting coin ---
        // Only shows up AFTER the player has visited the nursery (plant.html).
        // Click it once to claim 1 coin; after that it disappears for good
        // (rendered useless — the claimed flag stops it ever coming back).
        const homeCoin = document.createElement('button');
        homeCoin.type = 'button';
        homeCoin.id = 'home-coin';
        homeCoin.className = 'home-coin';
        homeCoin.setAttribute('aria-label', 'a shiny coin');
        document.body.appendChild(homeCoin);

        function renderHomeCoin() {
            homeCoin.hidden = !(hasVisitedPlant() && !isStartCoinClaimed());
        }
        renderHomeCoin();

        homeCoin.addEventListener('click', () => {
            if (claimStartCoin()) {
                homeCoin.hidden = true;       // gone & useless now
                renderCoinBalance();         // 0 -> 1 (hint disappears)
                renderBrokeHint();
            }
        });

        // Re-render when returning to this page via the browser back button
        // (back-forward cache restores the old DOM without re-running JS,
        // so the coin / hint would otherwise be stale). `pageshow` fires on
        // both a fresh load and a bfcache restore.
        window.addEventListener('pageshow', () => {
            renderCoinBalance();
            renderBrokeHint();
            renderHomeCoin();
        });

        // ===== Dev / test safe =====
        // A little safe on the home page. Enter the right code to dump
        // 100 carrots + 20,000 coins into storage for easy testing.
        const SAFE_CODE = '3141592653589';
        const HARV_KEY    = 'bearcave_harvested';   // current harvested crops
        const safeBtn   = document.getElementById('test-safe');
        const safeModal = document.getElementById('test-safe-modal');
        const safeInput = document.getElementById('test-safe-code');
        const safeOk    = document.getElementById('test-safe-ok');
        const safeBack  = document.getElementById('test-safe-back');
        const safeMsg    = document.getElementById('test-safe-msg');

        if (safeBtn) {
            safeBtn.addEventListener('click', () => {
                safeMsg.hidden = true;
                safeMsg.textContent = '';
                safeInput.value = '';
                safeModal.hidden = false;
                safeInput.focus();
            });
        }
        function closeSafe() { if (safeModal) safeModal.hidden = true; }

        if (safeBack) safeBack.addEventListener('click', closeSafe);
        if (safeModal) safeModal.addEventListener('click', e => { if (e.target === safeModal) closeSafe(); });

        function claimSafe() {
            // dump 100 carrots into current harvested inventory + lifetime
            // count, so the rabbit door sees "grown 100" and there are 100
            // carrots ready to give away.
            const h = loadJSON(HARV_KEY, {});
            h.carrot = (h.carrot || 0) + 100;
            saveJSON(HARV_KEY, h);
            addHarvested('carrot', 100);
            addCoins(20000);
            renderCoinBalance();
            safeMsg.hidden = false;
            safeMsg.textContent = 'safe cracked! +100 carrots, +20,000 coins.';
        }

        if (safeOk) safeOk.addEventListener('click', () => {
            if (safeInput.value.trim() === SAFE_CODE) {
                claimSafe();
            } else {
                safeMsg.hidden = false;
                safeMsg.textContent = 'wrong code.';
            }
        });
        if (safeInput) safeInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); safeOk.click(); }
        });
    </script>
</body>
</html>
